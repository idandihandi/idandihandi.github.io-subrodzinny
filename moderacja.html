<!doctype html>
<html lang="pl" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Administrator — RODZINNYSUB</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&display=swap');
:root{--bg:#f5f7fb;--card:#fff;--text:#111827;--muted:#697386;--primary:#6d4aff;--border:#e4e7ef;--ok:#16855b;--warn:#a96500;--danger:#c63b52;--shadow:0 18px 50px rgba(40,30,100,.1)}html[data-theme=dark]{--bg:#0d1020;--card:#171b30;--text:#f5f7fb;--muted:#aeb5c7;--border:rgba(255,255,255,.1);--shadow:0 18px 50px rgba(0,0,0,.35)}*{box-sizing:border-box}body{margin:0;font-family:Manrope,system-ui;color:var(--text);background:radial-gradient(circle at 10% 0,rgba(109,74,255,.15),transparent 30rem),var(--bg)}button,input,select,textarea{font:inherit}.wrap{width:min(1240px,calc(100% - 28px));margin:auto}.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid var(--border)}.nav{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font:700 1rem "Space Grotesk";letter-spacing:.1em}.brand span{color:var(--primary)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,#6d4aff,#8d6bff);color:#fff}.ghost{background:var(--card);color:var(--text);border:1px solid var(--border)}.ok{background:#e8f8f1;color:var(--ok)}.warn{background:#fff5df;color:var(--warn)}.danger{background:#fff0f2;color:var(--danger)}.hidden{display:none!important}.login{max-width:470px;margin:70px auto;padding:28px;background:var(--card);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow)}.field{display:grid;gap:7px;margin:13px 0}.field label{font-size:.8rem;font-weight:800;color:var(--muted)}.control{width:100%;padding:12px 13px;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);outline:none}main{padding:34px 0 70px}.hero{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:22px}.hero h1{font:700 clamp(2rem,5vw,3.4rem) "Space Grotesk";letter-spacing:-.04em;margin:0 0 7px}.muted{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}.stat{padding:17px;background:var(--card);border:1px solid var(--border);border-radius:17px}.stat strong{display:block;font:700 1.55rem "Space Grotesk"}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab.active{background:var(--text);color:var(--card)}.toolbar{display:flex;gap:10px;margin-bottom:15px}.toolbar input{flex:1}.grid{display:grid;gap:13px}.card{padding:19px;background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:0 8px 25px rgba(40,30,100,.05)}.card-head{display:flex;justify-content:space-between;gap:15px;align-items:start}.card h3{margin:0 0 4px}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:.73rem;font-weight:800}.role-badge{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:.72rem;font-weight:900;margin-left:6px}.role-admin{background:#ffd700;color:#2b2100}.role-moderator{background:#27ae60;color:#fff}.role-user{background:var(--bg);color:var(--muted)}.inline-select{min-width:170px}.ban-box{margin-top:12px;padding:13px;border:1px solid var(--border);border-radius:13px;background:var(--bg);display:grid;gap:10px}.ban-grid{display:grid;grid-template-columns:180px 1fr;gap:10px}.ban-info{padding:10px 12px;border-radius:12px;background:#fff0f2;color:var(--danger);font-size:.85rem;line-height:1.5}.pending{background:#fff5df;color:var(--warn)}.approved,.active{background:#e8f8f1;color:var(--ok)}.rejected,.banned{background:#fff0f2;color:var(--danger)}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0;padding:13px;border-radius:13px;background:var(--bg)}.meta small{display:block;color:var(--muted)}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.empty{text-align:center;padding:50px;border:1px dashed var(--border);border-radius:18px;color:var(--muted);background:var(--card)}.toast{position:fixed;right:18px;bottom:18px;padding:13px 16px;border-radius:13px;color:#fff;background:#17132d;display:none}#themeBtn{position:fixed;right:20px;bottom:20px;z-index:9999;width:52px;height:52px;border-radius:50%;box-shadow:var(--shadow)}.toast.show{display:block}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.meta{grid-template-columns:1fr 1fr}}@media(max-width:580px){.stats,.meta,.ban-grid{grid-template-columns:1fr}.hero,.card-head{align-items:start;flex-direction:column}.toolbar{flex-direction:column}}
</style></head>
<body>
<header class="top"><div class="wrap nav"><div class="brand">RODZINNY<span>SUB</span> / ADMIN</div><div class="row"><a class="btn ghost" href="index.html">Strona główna</a><button class="btn danger hidden" id="logout">Wyloguj</button></div></div></header>
<section id="loginView" class="login"><h1>Panel administratora</h1><p class="muted">Zaloguj się kontem administratora wskazanym w regułach Firestore.</p><form id="loginForm"><div class="field"><label>E-mail</label><input class="control" name="email" type="email" required></div><div class="field"><label>Hasło</label><input class="control" name="password" type="password" required></div><button class="btn primary" style="width:100%">Zaloguj</button></form></section>
<main id="dashboard" class="wrap hidden"><div class="hero"><div><h1>Centrum zarządzania</h1><p class="muted">Ogłoszenia, użytkownicy, oceny i rozmowy.</p></div><div id="adminEmail" class="muted"></div></div><div class="stats"><div class="stat"><strong id="sPending">0</strong><span class="muted">oczekujących</span></div><div class="stat"><strong id="sApproved">0</strong><span class="muted">aktywnych</span></div><div class="stat"><strong id="sUsers">0</strong><span class="muted">użytkowników</span></div><div class="stat"><strong id="sReviews">0</strong><span class="muted">ocen</span></div><div class="stat"><strong id="sChats">0</strong><span class="muted">rozmów</span></div></div><div class="tabs"><button class="btn tab active" data-tab="listings">Ogłoszenia</button><button class="btn tab ghost" data-tab="users">Użytkownicy</button><button class="btn tab ghost" data-tab="reviews">Oceny</button><button class="btn tab ghost" data-tab="chats">Czaty</button></div><div class="toolbar"><input class="control" id="search" placeholder="Szukaj w bieżącej zakładce"><select class="control" id="statusFilter" style="max-width:220px"><option value="">Wszystkie statusy</option><option value="pending">Oczekujące</option><option value="approved">Zatwierdzone</option><option value="rejected">Odrzucone</option><option value="active">Aktywne</option><option value="banned">Zablokowane</option></select></div><div id="content" class="grid"></div></main><button class="btn ghost" id="themeBtn">🌙</button><div id="toast" class="toast"></div>
<script type="module">
import {auth,db} from './firebase-config.js';
import {signInWithEmailAndPassword,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';
import {collection,doc,getDoc,getDocs,query,orderBy,onSnapshot,updateDoc,deleteDoc,writeBatch,Timestamp,serverTimestamp} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';
const statusLabels={pending:'W moderacji',approved:'Zatwierdzone',rejected:'Odrzucone',active:'Aktywne',banned:'Zablokowane'};const roleLabels={user:'Użytkownik',moderator:'Moderator',admin:'Administrator'};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=(v='')=>String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c])),money=v=>new Intl.NumberFormat('pl-PL',{style:'currency',currency:'PLN'}).format(Number(v)),date=v=>v?.toDate?new Intl.DateTimeFormat('pl-PL',{dateStyle:'medium',timeStyle:'short'}).format(v.toDate()):'—';let listings=[],users=[],reviews=[],chats=[],tab='listings',unsubs=[];const roleBadge=r=>`<span class="role-badge role-${esc(r||'user')}">${esc(roleLabels[r]||roleLabels.user)}</span>`;const banDate=v=>v?.toDate?date(v):'bezterminowo';function toast(m){$('#toast').textContent=m;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),3500)}
const theme=localStorage.getItem('rs-theme')||'light';document.documentElement.dataset.theme=theme;$('#themeBtn').textContent=theme==='dark'?'☀️':'🌙';$('#themeBtn').onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('rs-theme',n);$('#themeBtn').textContent=n==='dark'?'☀️':'🌙'};
$('#loginForm').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.currentTarget));try{await signInWithEmailAndPassword(auth,d.email,d.password)}catch(err){console.error(err);toast('Nieprawidłowy e-mail lub hasło.')}};$('#logout').onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{
  unsubs.forEach(f=>f());
  unsubs=[];

  if(!u){
    $('#loginView').classList.remove('hidden');
    $('#dashboard').classList.add('hidden');
    $('#logout').classList.add('hidden');
    return;
  }

  try{
    const profileSnap=await getDoc(doc(db,'users',u.uid));
    const profile=profileSnap.exists()?profileSnap.data():{};
    const role=String(profile.role||'').toLowerCase();
    const allowed=role==='admin'||role==='moderator'||u.email==='admin@admin.com';

    if(!allowed){
      await signOut(auth);
      $('#loginView').classList.remove('hidden');
      $('#dashboard').classList.add('hidden');
      $('#logout').classList.add('hidden');
      toast('To konto nie ma roli administratora ani moderatora.');
      return;
    }

    $('#loginView').classList.add('hidden');
    $('#dashboard').classList.remove('hidden');
    $('#logout').classList.remove('hidden');
    $('#adminEmail').textContent=`${u.email||''} · ${role||'admin'}`;
    listen();
  }catch(err){
    console.error('Błąd sprawdzania roli:',err);
    await signOut(auth);
    toast('Nie udało się sprawdzić uprawnień konta.');
  }
});
function listen(){const configs=[['listings',v=>listings=v],['users',v=>users=v],['reviews',v=>reviews=v],['chats',v=>chats=v]];configs.forEach(([name,setter])=>{const unsub=onSnapshot(collection(db,name),snap=>{setter(snap.docs.map(d=>({id:d.id,...d.data()})));updateStats();render()},err=>{console.error(err);toast('Brak uprawnień administratora. Sprawdź e-mail w firestore.rules.')});unsubs.push(unsub)})}
function updateStats(){$('#sPending').textContent=listings.filter(x=>x.status==='pending').length;$('#sApproved').textContent=listings.filter(x=>x.status==='approved').length;$('#sUsers').textContent=users.length;$('#sReviews').textContent=reviews.length;$('#sChats').textContent=chats.length}
function render(){const q=$('#search').value.trim().toLowerCase(),st=$('#statusFilter').value;let data=tab==='listings'?listings:tab==='users'?users:tab==='reviews'?reviews:chats;data=data.filter(x=>JSON.stringify(x).toLowerCase().includes(q)&&(!st||x.status===st));$('#content').innerHTML=data.length?data.map(x=>tab==='listings'?listingCard(x):tab==='users'?userCard(x):tab==='reviews'?reviewCard(x):chatCard(x)).join(''):'<div class="empty">Brak danych.</div>';bindActions()}
function listingCard(x){return`<article class="card"><div class="card-head"><div><h3>${esc(x.service)} · ${esc(x.plan)}</h3><span class="muted">${esc(x.ownerName||'Użytkownik')} · ${date(x.createdAt)}</span></div><span class="badge ${esc(x.status)}">${esc(statusLabels[x.status]||x.status)}</span></div><div class="meta"><div><small>Cena</small><strong>${money(x.price)}</strong></div><div><small>Miejsca</small><strong>${x.spots}</strong></div><div><small>Właściciel UID</small><strong>${esc((x.ownerUid||'').slice(0,10))}</strong></div><div><small>ID</small><strong>${x.id.slice(0,10)}</strong></div></div><p>${esc(x.description)}</p><div class="actions"><button class="btn ok" data-listing-status="approved" data-id="${x.id}">Zatwierdź</button><button class="btn warn" data-listing-status="rejected" data-id="${x.id}">Odrzuć</button><button class="btn danger" data-delete-listing="${x.id}">Usuń</button></div></article>`}
function userCard(x){const role=x.role||'user',isBanned=x.status==='banned',banText=isBanned?`<div class="ban-info"><strong>Konto zablokowane</strong><br>Powód: ${esc(x.banReason||'Nie podano')}<br>Do: ${x.banPermanent?'bezterminowo':banDate(x.banUntil)}</div>`:'';return`<article class="card"><div class="card-head"><div><h3>${esc(x.displayName||'Użytkownik')} ${roleBadge(role)}</h3><span class="muted">${esc(x.email||'—')} · ${date(x.createdAt)}</span></div><span class="badge ${esc(x.status||'active')}">${esc(statusLabels[x.status||'active']||x.status||'active')}</span></div><div class="meta"><div><small>Pseudonim</small><strong>${esc(x.nickname||x.city||'—')}</strong></div><div><small>Rola</small><strong>${esc(roleLabels[role]||roleLabels.user)}</strong></div><div><small>UID</small><strong>${esc(x.id.slice(0,12))}</strong></div><div><small>Ogłoszenia</small><strong>${listings.filter(l=>l.ownerUid===x.id).length}</strong></div></div><p>${esc(x.bio||'Brak opisu.')}</p>${banText}<div class="ban-box"><div class="ban-grid"><select class="control inline-select" data-role-select="${x.id}"><option value="user" ${role==='user'?'selected':''}>Użytkownik</option><option value="moderator" ${role==='moderator'?'selected':''}>Moderator</option><option value="admin" ${role==='admin'?'selected':''}>Administrator</option></select><button class="btn primary" data-save-role="${x.id}">Zapisz rolę</button></div><div class="ban-grid"><select class="control" data-ban-duration="${x.id}"><option value="1h">1 godzina</option><option value="12h">12 godzin</option><option value="1d">1 dzień</option><option value="3d">3 dni</option><option value="7d">7 dni</option><option value="30d">30 dni</option><option value="permanent">Na zawsze</option></select><input class="control" data-ban-reason="${x.id}" maxlength="300" placeholder="Powód blokady" value="${esc(x.banReason||'')}"></div><div class="actions"><button class="btn warn" data-ban-user="${x.id}">Zablokuj konto</button>${isBanned?`<button class="btn ok" data-unban-user="${x.id}">Odblokuj konto</button>`:''}<button class="btn danger" data-delete-user="${x.id}">Usuń profil i dane</button></div></div></article>`}
function reviewCard(x){return`<article class="card"><div class="card-head"><div><h3>${'★'.repeat(Number(x.rating||0))}</h3><span class="muted">Autor: ${esc(x.authorName||x.authorUid)} · ${date(x.createdAt)}</span></div></div><p>${esc(x.comment)}</p><div class="meta"><div><small>Autor UID</small><strong>${esc((x.authorUid||'').slice(0,12))}</strong></div><div><small>Oceniany UID</small><strong>${esc((x.targetUid||'').slice(0,12))}</strong></div></div><div class="actions"><button class="btn danger" data-delete-review="${x.id}">Usuń ocenę</button></div></article>`}
function chatCard(x){return`<article class="card"><div class="card-head"><div><h3>Rozmowa ${x.id.slice(0,12)}</h3><span class="muted">${date(x.updatedAt)}</span></div></div><div class="meta"><div><small>Uczestnicy</small><strong>${(x.participantUids||[]).length}</strong></div><div><small>Ogłoszenie</small><strong>${esc((x.listingId||'bez').slice(0,12))}</strong></div></div><p>${esc(x.lastMessage||'Brak wiadomości')}</p><div class="actions"><button class="btn danger" data-delete-chat="${x.id}">Usuń rozmowę</button></div></article>`}
function bindActions(){$$('[data-listing-status]').forEach(b=>b.onclick=()=>updateDoc(doc(db,'listings',b.dataset.id),{status:b.dataset.listingStatus,updatedAt:new Date()}));$$('[data-save-role]').forEach(b=>b.onclick=async()=>{const sel=document.querySelector(`[data-role-select="${b.dataset.saveRole}"]`);await updateDoc(doc(db,'users',b.dataset.saveRole),{role:sel.value,updatedAt:serverTimestamp()});toast('Rola została zapisana.')});$$('[data-ban-user]').forEach(b=>b.onclick=()=>banUser(b.dataset.banUser));$$('[data-unban-user]').forEach(b=>b.onclick=()=>unbanUser(b.dataset.unbanUser));$$('[data-delete-review]').forEach(b=>b.onclick=()=>confirm('Usunąć ocenę?')&&deleteDoc(doc(db,'reviews',b.dataset.deleteReview)));$$('[data-delete-chat]').forEach(b=>b.onclick=()=>confirm('Usunąć rozmowę?')&&deleteDoc(doc(db,'chats',b.dataset.deleteChat)));$$('[data-delete-listing]').forEach(b=>b.onclick=()=>removeListing(b.dataset.deleteListing));$$('[data-delete-user]').forEach(b=>b.onclick=()=>removeUserData(b.dataset.deleteUser))}

async function banUser(uid){const duration=document.querySelector(`[data-ban-duration="${uid}"]`)?.value||'1d',reason=document.querySelector(`[data-ban-reason="${uid}"]`)?.value.trim()||'';if(!reason)return toast('Wpisz powód blokady.');const map={"1h":3600e3,"12h":12*3600e3,"1d":86400e3,"3d":3*86400e3,"7d":7*86400e3,"30d":30*86400e3};const permanent=duration==='permanent';await updateDoc(doc(db,'users',uid),{status:'banned',banReason:reason,banUntil:permanent?null:Timestamp.fromDate(new Date(Date.now()+map[duration])),banPermanent:permanent,bannedAt:serverTimestamp(),updatedAt:serverTimestamp()});toast('Konto zostało zablokowane.')}
async function unbanUser(uid){await updateDoc(doc(db,'users',uid),{status:'active',banReason:'',banUntil:null,banPermanent:false,updatedAt:serverTimestamp()});toast('Konto zostało odblokowane.')}

async function removeListing(id){if(!confirm('Usunąć ogłoszenie?'))return;const batch=writeBatch(db);batch.delete(doc(db,'listings',id));batch.delete(doc(db,'listingContacts',id));await batch.commit();toast('Ogłoszenie usunięte.')}
async function removeUserData(uid){if(!confirm('Usunąć profil, ogłoszenia i oceny użytkownika? Konta Authentication nie można usunąć z przeglądarki — usuń je osobno w Firebase Authentication.'))return;const batch=writeBatch(db);batch.delete(doc(db,'users',uid));listings.filter(x=>x.ownerUid===uid).forEach(x=>batch.delete(doc(db,'listings',x.id)));reviews.filter(x=>x.authorUid===uid||x.targetUid===uid).forEach(x=>batch.delete(doc(db,'reviews',x.id)));await batch.commit();toast('Dane użytkownika usunięte.')}
$$('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;$$('[data-tab]').forEach(x=>{x.classList.toggle('active',x===b);x.classList.toggle('ghost',x!==b)});$('#statusFilter').value='';render()});$('#search').oninput=render;$('#statusFilter').oninput=render;
</script></body></html>
